name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version tag (vX.Y.Z)"
        required: true
        default: "v1.2.5"
        type: string

# Read-only by default: the build jobs run third-party actions, dependency
# build scripts and install hooks, none of which may hold a token that can
# publish. Only the job that creates the release asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          V=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG=$REF_NAME
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be vMAJOR.MINOR.PATCH"; exit 1; }
          [ "$TAG" = "$V" ] || { echo "::error::Version $TAG must match Cargo.toml ($V); update Cargo.toml and Cargo.lock first"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install --locked cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      # install.sh downloads exactly this name; changing it breaks every
      # install command the hub issues.
      - run: cp "target/${{ matrix.target }}/release/monitor-agent" "monitor-agent-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-agent-${{ matrix.target }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # The hub relays these through an operator-configured GitHub proxy and
      # install.sh executes what arrives, so the hub relays a binary only with a
      # signature that verifies under the public key built into it. The private
      # key reaches this job alone. Checked against that same public key here, so
      # a secret holding any other key fails the release instead of publishing
      # binaries no hub will relay.
      - run: |
          [ -n "$AGENT_SIGNING_KEY" ] || { echo "::error::the AGENT_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          trap 'rm -f "$RUNNER_TEMP/key.pem"' EXIT
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/pub.pem"
          for b in monitor-agent-*-musl; do
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$b" -out "$b.sig"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in "$b" -sigfile "$b.sig"
          done
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
          # The hub's `AGENT_SIGNING_KEY` (src/main.rs in the hub repository).
          PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAR77wPOW0ypifIU726OTvvi4Tm/XQSUuBAC+VbnIFgj8=
            -----END PUBLIC KEY-----
      # Never move a tag. The selected commit is the one checked and built,
      # even if the selected branch has moved since the run started.
      - name: Create or verify tag
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG"
            ACTUAL=$(git rev-parse 'FETCH_HEAD^{commit}')
            [ "$ACTUAL" = "$GITHUB_SHA" ] || { echo "::error::Tag $TAG points to a different commit; it will not be moved"; exit 1; }
          else
            STATUS=$?
            [ "$STATUS" = 2 ] || { echo "::error::Could not check the remote tag"; exit "$STATUS"; }
            [ "$EVENT_NAME" = workflow_dispatch ] || { echo "::error::Tag $TAG is missing"; exit 1; }
            git push origin "$GITHUB_SHA:refs/tags/$TAG"
          fi
        env:
          TAG: ${{ needs.check.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
      # sha256sums.txt has bare asset names; the glob excludes signatures.
      - name: Publish GitHub release
        run: |
          mkdir -p bin && mv monitor-agent-* bin/
          (cd bin && sha256sum monitor-agent-*-musl > sha256sums.txt)
          gh release create "$TAG" bin/monitor-agent-* bin/sha256sums.txt \
            --verify-tag --generate-notes --latest --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ needs.check.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
